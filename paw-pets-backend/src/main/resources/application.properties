# Nombre de la aplicación (aparece en logs y herramientas de monitoreo).
spring.application.name=paw-pets-backend

# Puerto del backend (el frontend apunta aquí con VITE_API_URL)
# Puerto del servidor Tomcat embebido: la API queda en http://localhost:8080.
server.port=8080

# Lee los secretos desde el archivo .env (está en .gitignore y nunca se sube).
# "optional:" evita un error si el archivo no existe; [.properties] indica su formato KEY=valor.
# Importa un archivo externo de configuración. Así Spring lee las variables del .env como si fueran propiedades.
spring.config.import=optional:file:.env[.properties]

# MongoDB Atlas: la URI completa (usuario, clave, cluster y base) viene de .env
# Cadena de conexión a MongoDB Atlas. ${MONGODB_URI} es un marcador: se reemplaza por el valor del .env (así el usuario y clave no quedan escritos en el código).
spring.mongodb.uri=mongodb+srv://pawpets:contrapulenta123@cluster0.iriwpdx.mongodb.net/pawpets

# JWT: clave para firmar los tokens (mínimo 32 caracteres) y su duración
# Clave con la que se firman y verifican los JWT. La lee SecurityConfig con @Value("${jwt.secreto}").
jwt.secreto=${JWT_SECRET}
# Vida del token: 60 minutos. La lee JwtService con @Value("${jwt.expiracion-minutos}").
jwt.expiracion-minutos=60

# Origen del frontend que puede llamar a la API (CORS)
# Origen del frontend permitido por CORS. ${CORS_ORIGIN:http://localhost:5173} = usa la variable CORS_ORIGIN o, si no existe, ese valor por defecto. Lo lee CorsConfig.
cors.origen=${CORS_ORIGIN:http://localhost:5173}

# Swagger UI en /swagger-ui.html, igual que el ejemplo del profesor
# Ruta de la documentación interactiva: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
